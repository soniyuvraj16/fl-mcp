[project]
name = "fl-mcp"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "soniyuvraj16", email = "soniyuvraj@tamu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10",
    "mido>=1.3.3",
    "numpy>=1.26",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
fl-mcp = "fl_mcp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fl-studio-api-stubs>=37.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
